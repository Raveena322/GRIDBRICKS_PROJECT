server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
